# Every pull request author accepts the contributor licence agreement in
# CONTRIBUTING.md once, by comment on the pull request. The check fails until
# they have. Acceptances are recorded in the private repository
# commonmeasure/cla-signatures, written with the CLA_SIGNATURES_TOKEN secret,
# so nothing is committed to this repository.
name: cla

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: Contributor licence agreement
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # contributor-assistant/github-action v2.6.1, pinned by commit.
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-document: https://github.com/commonmeasure/commonmeasure/blob/main/CONTRIBUTING.md
          remote-organization-name: commonmeasure
          remote-repository-name: cla-signatures
          path-to-signatures: signatures/version1/cla.json
          branch: main
          allowlist: bot*
          custom-notsigned-prcomment: 'Thank you for the pull request. Before it can be merged, please accept the contributor licence agreement in CONTRIBUTING.md by posting the comment below, exactly. It assigns copyright in your contribution to Common Measure Ltd and is asked for once.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'Every contributor to this pull request has accepted the contributor licence agreement.'
          lock-pullrequest-aftermerge: false
