# Secret-scanning configuration. Four strings gitleaks flags are not secrets:
# the committed demonstration signing identity, which authorises nothing and
# is on no trust list (demo/provenance/README.md), a fixture in the relay's
# test for stripping embedded credentials from a projected URL, the browser
# extension's public key, which Chrome reads from the manifest to fix the
# extension's id (browser/README.md), and the `release_signer` public-key
# test vector (an Ed25519 verification key that signs nothing; the policy
# tests, the contract vectors and the release end-to-end test share it).
[extend]
useDefault = true

[allowlist]
description = "Committed material that is not a credential"
paths = [
  '''demo/provenance/signer-key\.pem$''',
]
regexes = [
  '''sk-live-SECRET123''',
  '''MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAlQA0FYlBu2tFltdwvPw9vJ3Itjl6x2dBmmGmzmbCCFpzjgV81''',
  '''E5j2LG0aRXxRumpLXz29L2n8qTIWIY3ImX5Ba9F9k8o=''',
]
