<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Common Measure</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      body {
        width: 320px;
        margin: 0;
        padding: 14px 16px;
        font-size: 13px;
        line-height: 1.45;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 6px 12px;
        margin: 0;
      }
      dt {
        opacity: 0.7;
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
    </style>
  </head>
  <body>
    <h1>Common Measure</h1>
    <dl>
      <dt>Binary</dt>
      <dd id="binary">checking</dd>
      <dt>Recording</dt>
      <dd id="recording">-</dd>
      <dt>Last answer</dt>
      <dd id="last">none sent</dd>
    </dl>
    <script type="module" src="popup.js"></script>
  </body>
</html>
